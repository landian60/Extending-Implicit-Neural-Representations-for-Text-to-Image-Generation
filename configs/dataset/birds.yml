dataset_name: 'birds'
data_dir: 'data/birds'

resolution: 256
z_dim: 100
cond_dim: 512
manual_seed: 100
cuda: True

clip4evl: {'src':"clip", 'type':'ViT-B/32'}
clip4trn: {'src':"clip", 'type':'ViT-B/32'}
clip4text: {'src':"clip", 'type':'ViT-B/32'}

stamp: 'normal'
state_epoch: 1
max_epoch: 1502
batch_size: 16
gpu_id: 0
nf: 64
ch_size: 3

scaler_min: 64
growth_interval: 2000
lr_g: 0.0001
lr_d: 0.0004
sim_w: 4.0

gen_interval: 5
test_interval: 20
save_interval: 20

sample_times: 12
npz_path: null
log_dir: 'new'

multi_gpus: True
